name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # --ignore-scripts: the root `prepare` (lefthook install) is for local dev hooks;
      # lefthook is proto-pinned, not an npm dep, so it is absent on runners.
      - run: bun install --frozen-lockfile --ignore-scripts

      # `gate` runs `spur rule run` (pre/post-check). spur is tracked at latest, never pinned.
      - name: Install spur
        run: |
          bun install --global @gobing-ai/spur@latest
          echo "$(bun pm bin -g)" >> "$GITHUB_PATH"

      - run: bun run gate

      # `gate` formats in place; any diff means unformatted code was pushed.
      - name: Fail on formatting drift
        run: git diff --exit-code
