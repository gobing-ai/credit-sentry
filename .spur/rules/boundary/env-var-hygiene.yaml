$schema: "@gobing-ai/spur/schemas/rule-file.schema.json"
# Environment-variable hygiene — local override of the global boundary/env-var-hygiene.yaml.
# The global rule assumes `@gobing-ai/ts-utils` supplies the env gateway. This repo has no
# such dependency, so the gateway is `packages/utils/src/env.ts` (the base package — config,
# db and apps import it without a cycle; `@credit-sentry/config` re-exports it as the app-side
# funnel). That one file is exempt; everything else must call `getEnvVar` / `getEnvVars`.
# `apps/web` uses `import.meta.env` (Vite browser plane), which never matches.
include:
  - "apps/**/src/**/*.{ts,tsx}"
  - "apps/**/tests/**/*.{ts,tsx}"
  - "packages/**/src/**/*.{ts,tsx}"
  - "packages/**/tests/**/*.{ts,tsx}"
exclude:
  - "packages/utils/src/env.ts"
rules:
  - id: env-var-hygiene
    description: >
      No direct `process.env` or `Bun.env` access outside the `packages/utils/src/env.ts`
      gateway. Read via `getEnvVar`, compose via `getEnvVars()`, or take an injected `env`
      record parameter.
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "process\\.env|\\bBun\\.env\\b"
