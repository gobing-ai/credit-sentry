# Bun/tooling rules — credit-sentry standardizes on Bun + bun:test (AGENTS.md "Stack").
# Adapted from ts-libs, re-scoped to the apps/ + packages/ monorepo layout.
# The server Cloudflare Workers Vitest exception is removed — credit-sentry has no
# Workers runtime.
include:
  - "package.json"
  - "apps/**/*.ts"
  - "packages/**/*.ts"
exclude:
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-npm-pnpm-yarn-scripts
    description: "Use bun scripts instead of npm, pnpm, or yarn commands (AGENTS.md: no npm/pnpm/yarn)."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "\\b(npm run|pnpm|yarn)\\b"
    include:
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "**/*.yml"
      - "**/*.yaml"
    # `.spur/rules/**` needs no exclude: ripgrep never descends into hidden dirs.

  - id: enforce-bun-test
    description: "Unit/integration tests must use bun:test, not Jest or Mocha."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: 'from [''"](jest|mocha|@jest)'
    include:
      - "apps/**/*.test.ts"
      - "packages/**/*.test.ts"

  - id: no-vitest-imports-or-apis
    description: "Use bun:test APIs instead of vitest."
    severity: error
    evaluator:
      type: rg
      config:
        pattern: "from ['\"]vitest['\"]|vi\\.(fn|spyOn|mock|stub)\\b"
    include:
      - "apps/**/*.ts"
      - "packages/**/*.ts"
