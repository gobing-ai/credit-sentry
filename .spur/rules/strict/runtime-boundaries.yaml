# Runtime boundaries: process execution and fs IO hygiene.
# Adapted from spur's strict/runtime-boundaries.yaml for credit-sentry. Runs in
# recommended-pre-check (via the `strict` category) and in strict-check.
include:
  - "apps/**/src/**/*.ts"
  - "packages/**/src/**/*.ts"
exclude:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/node_modules/**"
  - "**/dist/**"

rules:
  - id: no-direct-process-spawn
    description: >
      Do not call Bun.spawn/spawnSync, import node:child_process, or pull in
      execa/zx at app/package sources. Introduce a single process seam first and
      allowlist it here.
    severity: error
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - specifier: "node:child_process"
          - specifier: "child_process"
          - pattern: "Bun\\.(spawn|spawnSync)\\s*\\("
            matchMode: usage
          - specifier: "execa"
          - specifier: "zx"
        scope:
          include:
            - "apps/**/src/**/*.ts"
            - "packages/**/src/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"

  - id: no-direct-fs-io
    description: "Keep direct fs IO (node:fs, Bun.write) behind sanctioned seams; allowlist each one here."
    severity: warning
    evaluator:
      type: forbidden-import
      config:
        forbidden:
          - pattern: "from\\s+['\"]node:fs(?:/promises)?['\"]|require\\(['\"]node:fs"
            matchMode: usage
          - pattern: "\\bBun\\.(?:write)\\("
            matchMode: usage
        scope:
          include:
            - "apps/**/src/**/*.ts"
            - "packages/**/src/**/*.ts"
          exclude:
            - "**/tests/**"
            - "**/*.test.ts"
            - "**/dist/**"
            # The output seam: logger writes to Bun.stdout/stderr by design.
            - "packages/utils/src/logger.ts"
            # The finance ledger seam: owner-private SQLite persistence (0o700 dir, 0o600
            # O_EXCL|O_NOFOLLOW file) is packages/db/src/finance.ts's contract, verified by
            # apps/server/tests/finance.test.ts permission scenarios.
            - "packages/db/src/finance.ts"
